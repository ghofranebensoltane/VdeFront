<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des etudiants</title>
    <link rel="stylesheet" href="index_styles.css" />
</head>
<body>
    <h1 class="h1">Liste des etudinats</h1>

    <input class="search" type="text" id="search" placeholder="rechercher....">

     <button class="btnAjouter" id="btnAjouter">Ajouter un étudiant</button>

  <table class="table" id="tableEtudiants">
    <thead>
      <tr class="tr">
        <th class="th">Nom</th>
        <th class="th">Prénom</th>
        <th class="th">Date de naissance</th>
        <th class="th">Nationalité</th>
        <th class="th">Email</th>
        <th class="th">Specialité</th>
        <th class="th">Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="index.js"></script>
    
</body>
</html>
